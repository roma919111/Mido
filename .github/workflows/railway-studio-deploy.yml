# Manual deploy only — production stays on Docker rollback until you explicitly deploy main.
# GitHub secret (one of): RAILWAY_PROJECT_TOKEN or RAILWAY_TOKEN = Project token (agile-serenity / Mido).
name: Deploy Vyronix Studio (Railway)

on:
  workflow_dispatch:

concurrency:
  group: railway-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN || secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Mido service from source
        run: railway up --detach --service Mido
