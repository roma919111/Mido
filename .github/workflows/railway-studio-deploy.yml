# Manual only — do NOT auto-deploy main until H3LabClient + /api/h3-lab are restored in git.
# Production studio should stay on the last Railway Docker rollback until then.
# Secret: RAILWAY_TOKEN (Project token for agile-serenity / Mido).
name: Deploy Vyronix Studio (Railway)

on:
  workflow_dispatch:

concurrency:
  group: railway-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Mido service from source
        run: railway up --detach --service Mido
