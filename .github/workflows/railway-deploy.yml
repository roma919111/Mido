name: Deploy to Railway

on:
  push:
    branches: [main]

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: agile-serenity / production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing in GitHub repository settings"
            exit 1
          fi
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            npx --yes @railway/cli@4.6.3 redeploy --service "$RAILWAY_SERVICE_ID" --yes
          else
            npx --yes @railway/cli@4.6.3 up --detach
          fi
