name: Deploy Stream Hub UI

on:
  push:
    branches: [main, cursor/android-stream-hub-944d]
    paths:
      - "stream-hub/**"
      - ".github/workflows/stream-hub-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stream-hub-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stream-hub/package-lock.json

      - name: Install and build demo site
        working-directory: stream-hub
        env:
          GITHUB_PAGES: "true"
          VITE_DEMO_MODE: "true"
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then
            export VITE_TMDB_API_KEY="$TMDB_KEY"
          else
            export VITE_TMDB_API_KEY="db5143fc00294cf9c33d5201d231c898"
          fi
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stream-hub/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
