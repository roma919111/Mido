name: Build Stream Hub APK

on:
  push:
    branches: [main, cursor/android-stream-hub-944d]
    paths:
      - "stream-hub/**"
      - ".github/workflows/stream-hub-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stream-hub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stream-hub/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and sync Capacitor
        run: |
          npm ci
          npm run build:android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream-hub-debug-apk
          path: stream-hub/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
